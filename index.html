<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeta 40 — Buscador de viajes</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1 class="site-title">Buscador de paquetes de aventura</h1>
    <img src="assets/img/logo_planeta40.png" alt="Planeta 40" class="logo">
  </header>

  <main>
    <section class="controls">
      <button id="btn-scan" type="button">Escanear catálogos</button>
      <button id="btn-open-urls" type="button">Escanear desde URL</button>
      <button id="btn-export" type="button" disabled>Exportar selección a Excel</button>
      <span id="status"></span>
    </section>

    <dialog id="urls-dialog" class="urls-dialog">
      <form method="dialog" class="urls-dialog-form">
        <h2>Escanear desde URL</h2>
        <p class="hint">Pega una URL de listado o categoría por línea (Baobabnature o Muntania). Los viajes encontrados se añaden a la tabla actual.</p>
        <textarea id="urls-input" rows="5" placeholder="Pega aquí una o varias URLs (una por línea)"></textarea>
        <div class="urls-dialog-actions">
          <button type="button" id="btn-urls-cancel" class="btn-secondary">Cancelar</button>
          <button type="button" id="btn-scan-urls" class="btn-primary">Escanear</button>
        </div>
      </form>
    </dialog>

    <section class="results">
      <table id="trips-table">
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all"></th>
            <th></th>
            <th>Empresa</th>
            <th>Título</th>
            <th>Destino</th>
            <th>Precio</th>
            <th>Duración</th>
            <th>Salidas</th>
          </tr>
        </thead>
        <tbody id="trips-body"></tbody>
      </table>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
